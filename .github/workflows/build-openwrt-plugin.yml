# 通用 OpenWrt LuCI 单/多插件编译器
# 支持单/多包自动探测、多级子目录、自动编译 i18n 翻译包
name: Build OpenWrt Plugin

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: '插件源码仓库地址 (HTTPS)'
        required: true
        default: 'https://github.com/wolvth/luci-app-dae.git'
      repo_branch:
        description: '仓库分支'
        required: false
        default: 'main'
      plugin_subdir:
        description: '插件子目录（留空=全仓库深度扫描，也支持指定如 qnatter）'
        required: false
        default: ''
      package_name:
        description: '手动指定包名（支持多个，空格或逗号分隔；留空则全自动检测）'
        required: false
        default: ''
      openwrt_version:
        description: 'OpenWrt SDK 版本'
        required: false
        default: '25.12.5'
      target_arch:
        description: '目标架构（格式: target subtarget）'
        required: false
        default: 'rockchip armv8'

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-24.04

    steps:
    # ── 1. 解析基础参数 ───────────────────────────────────────
    - name: 解析参数
      run: |
        ARCH="${{ inputs.target_arch }}"
        TARGET=$(echo "$ARCH" | awk '{print $1}')
        SUBTARGET=$(echo "$ARCH" | awk '{print $2}')
        REPO_NAME=$(basename -s .git "${{ inputs.repo_url }}")
        
        echo "VERSION=${{ inputs.openwrt_version }}" >> $GITHUB_ENV
        echo "TARGET=$TARGET"                       >> $GITHUB_ENV
        echo "SUBTARGET=$SUBTARGET"                 >> $GITHUB_ENV
        echo "REPO_NAME=$REPO_NAME"                 >> $GITHUB_ENV
        echo "PLUGIN_SUBDIR=${{ inputs.plugin_subdir }}" >> $GITHUB_ENV

    # ── 2. 安装依赖 ──────────────────────────────────────────
    - name: 安装基础编译依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yqq \
          build-essential libncurses-dev zlib1g-dev gawk git \
          gettext libssl-dev xsltproc rsync wget unzip file \
          python3 python3-pyelftools zstd dos2unix
        echo "✅ 编译依赖就绪"

    - name: 配置 Go 编译环境
      uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        
    # ── 3. SDK 缓存 ──────────────────────────────────────────
    - name: 缓存 SDK
      id: cache-sdk
      uses: actions/cache@v6
      with:
        path: sdk.tar.zst
        key: openwrt-sdk-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}

    # ── 4. 下载 SDK ──────────────────────────────────────────
    - name: 下载 SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}"
        echo "🔍 查询版本校验表: ${BASE}/sha256sums"
        
        SHALIST=$(wget -qO- "${BASE}/sha256sums" || true)
        if [ -z "$SHALIST" ]; then
          echo "❌ 无法访问该架构目录，请确认版本与架构拼写是否正确。"
          exit 1
        fi

        SDK_FILE=$(echo "$SHALIST" | grep -oE "openwrt-sdk-[^ ]+\.Linux-x86_64\.(tar\.zst|tar\.xz)" | head -n1)
        if [ -z "$SDK_FILE" ]; then
          echo "❌ 未在官方镜像中匹配到对应的 SDK 压缩包"
          exit 1
        fi

        echo "📦 开始下载 SDK: ${BASE}/${SDK_FILE}"
        wget -q --show-progress "${BASE}/${SDK_FILE}" -O sdk.tar.zst
        echo "✅ 下载完成: $(du -h sdk.tar.zst | cut -f1)"

    # ── 5. 解压 SDK ──────────────────────────────────────────
    - name: 解压 SDK
      run: |
        mkdir -p sdk
        tar -axf sdk.tar.zst -C sdk --strip-components=1
        echo "✅ SDK 解压完成"

    # ── 6. 初始化 Feeds ──────────────────────────────────────
    - name: 初始化 Feeds
      working-directory: sdk
      run: |
        ./scripts/feeds update -a >/dev/null 2>&1
        ./scripts/feeds install -a >/dev/null 2>&1
        echo "✅ Feeds 初始化完成"

    # ── 7. 完整保留目录结构平铺放入 SDK ──────────────────────
    - name: 部署源码并保留原始目录拓扑
      working-directory: sdk
      run: |
        REPO_DIR="/tmp/${REPO_NAME}"
        rm -rf "$REPO_DIR"
        git clone --depth 1 --branch "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" "$REPO_DIR"

        SRC_ROOT="$REPO_DIR"
        if [ -n "$PLUGIN_SUBDIR" ]; then
          SRC_ROOT="$REPO_DIR/$PLUGIN_SUBDIR"
          if [ ! -d "$SRC_ROOT" ]; then
            echo "❌ 指定子目录不存在: $PLUGIN_SUBDIR"
            exit 1
          fi
        fi

        # 区分单包仓库与多包聚合仓库
        if [ -f "$SRC_ROOT/Makefile" ]; then
          # 模式 A: 根目录本身就是单包
          PKG_NAME=$(basename "$SRC_ROOT")
          [ "$PKG_NAME" = "$REPO_NAME" ] && PKG_NAME=$(grep -E '^[[:space:]]*PKG_NAME[[:space:]]*[:?+]?=' "$SRC_ROOT/Makefile" | head -n1 | sed -E 's/.*=[[:space:]]*//' | tr -d '\r ' || echo "$REPO_NAME")
          
          mkdir -p "package/$PKG_NAME"
          cp -rT "$SRC_ROOT" "package/$PKG_NAME"
          echo "📂 单包模式部署至: package/$PKG_NAME"
        else
          # 模式 B: 多包聚合仓库（如 QNatter），必须原汁原味平铺拷贝，保持兄弟目录（如 go-qnatter）的相对路径不变！
          cp -rT "$SRC_ROOT" "package"
          echo "📂 多包模式：已将仓库所有文件夹平铺完整部署进 package/"
        fi

        # 修复 www -> htdocs 结构与 luci.mk 相对路径
        find package/ -type d -name "www" 2>/dev/null | while read -r w; do
          pdir=$(dirname "$w")
          mkdir -p "$pdir/htdocs"
          cp -rT "$w" "$pdir/htdocs"
          rm -rf "$w"
        done
        find package/ -name "Makefile" -exec sed -i 's#\.\./\.\./luci\.mk#$(TOPDIR)/feeds/luci/luci.mk#g' {} + 2>/dev/null || true

        # 智能识别哪些是可构建的 package（寻找带 Makefile 的一级子目录）
        declare -a DETECTED_PKGS=()
        declare -a DETECTED_DIRS=()

        while read -r mk; do
          P_DIR=$(basename "$(dirname "$mk")")
          DETECTED_DIRS+=("$P_DIR")

          # 从 Makefile 提取包名
          DEFS=$(grep -oE '^[[:space:]]*define[[:space:]]+Package/[^ /:]+' "$mk" | awk '{print $2}' | sed 's#Package/##' || true)
          FOUND=0
          for p in $DEFS; do
            if [[ "$p" != *'$('* ]] && [ -n "$p" ]; then
              DETECTED_PKGS+=("$p")
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 0 ]; then
            PK_VAL=$(grep -E '^[[:space:]]*PKG_NAME[[:space:]]*[:?+]?=' "$mk" | head -n1 | sed -E 's/.*=[[:space:]]*//' | tr -d '\r ' || true)
            if [ -n "$PK_VAL" ] && [[ "$PK_VAL" != *'$('* ]]; then
              DETECTED_PKGS+=("$PK_VAL")
            else
              DETECTED_PKGS+=("$P_DIR") # Fallback 到目录名
            fi
          fi
        done < <(find package/ -mindepth 2 -maxdepth 2 -name "Makefile" ! -path "package/feeds/*")

        # 若手动指定了包名则以手动为主
        INPUT_NAME="${{ inputs.package_name }}"
        if [ -n "$INPUT_NAME" ]; then
          DETECTED_PKGS=($(echo "$INPUT_NAME" | tr ',' ' '))
        fi

        FINAL_PKGS=($(echo "${DETECTED_PKGS[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))
        FINAL_DIRS=($(echo "${DETECTED_DIRS[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))

        echo "=========================================="
        echo "📁 待编译的源码目录: ${FINAL_DIRS[*]}"
        echo "📦 识别到的待编译包: ${FINAL_PKGS[*]}"
        echo "=========================================="

        echo "BUILD_PACKAGES=${FINAL_PKGS[*]}" >> $GITHUB_ENV
        echo "BUILD_DIRS=${FINAL_DIRS[*]}" >> $GITHUB_ENV

    # ── 8. 配置编译选项（启用 i18n 与多包） ────────────────────
    - name: 配置编译选项
      working-directory: sdk
      run: |
        # 激活全局 LuCI 语言支持（生成翻译包的核心）
        cat >> .config <<EOF
        CONFIG_LUCI_LANG_zh_Hans=y
        EOF

        # 逐个激活所有识别到的包，以及自动预测对应的翻译包
        for pkg in $BUILD_PACKAGES; do
          echo "CONFIG_PACKAGE_${pkg}=m" >> .config
          if [[ "$pkg" == luci-app-* ]]; then
            APP_NAME="${pkg#luci-app-}"
            echo "CONFIG_PACKAGE_luci-i18n-${APP_NAME}-zh-cn=m" >> .config
          fi
        done

        make defconfig 2>&1 | tail -n 15
        echo "✅ 配置生成就绪"

    # ── 9. 执行编译 ──────────────────────────────────────────
    - name: 逐包编译
      working-directory: sdk
      run: |
        # 按目录编译各个包（优先依赖编译）
        for dir in $BUILD_DIRS; do
          echo "🔨 [1/2] 正在编译源码目录: package/${dir} ..."
          make "package/${dir}/compile" -j$(nproc) || make "package/${dir}/compile" V=s -j1
        done

        # 针对 luci-app 兜底触发编译生成的翻译包
        for pkg in $BUILD_PACKAGES; do
          if [[ "$pkg" == luci-app-* ]]; then
            APP_NAME="${pkg#luci-app-}"
            echo "🔨 [2/2] 正在构建翻译包: luci-i18n-${APP_NAME}-zh-cn ..."
            make "package/luci-i18n-${APP_NAME}-zh-cn/compile" -j$(nproc) 2>/dev/null || true
          fi
        done
        echo "✅ 全部编译完成"

    # ── 10. 收集产物 ─────────────────────────────────────────
    - name: 收集编译产物
      run: |
        mkdir -p artifacts

        # 查找所有 ipk / apk 产物，匹配所有包名以及所有 i18n 语言包
        find sdk/bin -type f \( -name "*.ipk" -o -name "*.apk" \) | while read -r file; do
          FNAME=$(basename "$file")
          MATCHED=0

          for pkg in $BUILD_PACKAGES; do
            APP_NAME="${pkg#luci-app-}"
            # 匹配原包、或对应 app 的 i18n 包
            if [[ "$FNAME" == *"$pkg"* ]] || [[ "$FNAME" == *"luci-i18n-${APP_NAME}"* ]]; then
              MATCHED=1
              break
            fi
          done

          if [ $MATCHED -eq 1 ]; then
            echo "📦 找到产物: $FNAME"
            cp "$file" artifacts/
          fi
        done

        if [ ! "$(ls -A artifacts/ 2>/dev/null)" ]; then
          echo "❌ 未匹配到打包文件，以下是 bin/ 目录下的所有生成文件:"
          find sdk/bin -type f \( -name "*.apk" -o -name "*.ipk" \)
          exit 1
        fi

        echo ""
        echo "📦 收集到的所有交付物:"
        ls -lh artifacts/

    # ── 11. 上传构建结果 ─────────────────────────────────────
    - name: 上传产物
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.REPO_NAME }}-${{ env.VERSION }}-${{ env.TARGET }}-${{ env.SUBTARGET }}
        path: artifacts/*
        if-no-files-found: error
        retention-days: 90

    - name: 清理
      if: always()
      run: rm -rf sdk /tmp/plugin-repo artifacts
